<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Washam Waseem — Digital Archive</title>

    <meta
        name="description"
        content="The digital archive of Washam Waseem — writer, designer, marketer, storyteller and creative."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         BACKGROUND
    ========================== -->

    <div class="noise"></div>
    <div class="scanlines"></div>
    <div id="particles"></div>

    <!-- =========================
         TOP SYSTEM BAR
    ========================== -->

    <header class="system-bar">
        <div>
            <span class="status-dot"></span>
            WASHAM.WASEEM
        </div>

        <div class="system-status">
            DIGITAL ARCHIVE
            <span>///</span>
            <span id="pageCounter">01 / 07</span>
        </div>
    </header>


    <!-- =========================
         MAIN SCRAPBOOK
    ========================== -->

    <main class="portfolio">

        <div class="book">

            <div class="book-spine"></div>

            <div class="page-shadow"></div>

            <section
                id="page"
                class="page"
                aria-live="polite"
            >

                <!-- PAGE CONTENT IS GENERATED BY JS -->

            </section>

        </div>


        <!-- =========================
             PAGE CONTROLS
        ========================== -->

        <div class="controls">

            <button
                id="previous"
                class="nav-button"
                type="button"
                aria-label="Previous page"
            >
                ← PREV
            </button>

            <div class="page-dots" id="pageDots"></div>

            <button
                id="next"
                class="nav-button"
                type="button"
                aria-label="Next page"
            >
                NEXT →
            </button>

        </div>

        <div class="interaction-tip">
            <span>✦</span>
            CLICK. EXPLORE. TOUCH THINGS.
            <span>✦</span>
        </div>

    </main>


    <!-- =========================
         AUDIO CONTROL
    ========================== -->

    <button
        id="soundToggle"
        class="sound-toggle"
        type="button"
        aria-label="Toggle sound"
    >
        SOUND: ON
    </button>


    <!-- =========================
         CAMERA MODAL
    ========================== -->

    <div
        id="cameraModal"
        class="modal"
        aria-hidden="true"
    >

        <div class="camera-window">

            <button
                id="closeCamera"
                class="close-button"
                type="button"
            >
                ×
            </button>

            <div class="camera-title">
                <span class="status-dot"></span>
                CAMERA // LIVE
            </div>

            <video
                id="cameraVideo"
                autoplay
                playsinline
                muted
            ></video>

            <canvas id="cameraCanvas"></canvas>

            <div class="camera-controls">

                <button
                    id="takePhoto"
                    class="camera-shutter"
                    type="button"
                >
                    <span></span>
                </button>

            </div>

            <p id="cameraMessage">
                Point. Click. Capture.
            </p>

            <div
                id="capturedPhoto"
                class="captured-photo"
            ></div>

        </div>

    </div>


    <!-- =========================
         HIDDEN EASTER EGG
    ========================== -->

    <div
        id="secretMessage"
        class="secret-message"
        aria-hidden="true"
    >
        <div class="secret-box">

            <span class="secret-small">
                YOU FOUND SOMETHING.
            </span>

            <h2>✦</h2>

            <p>
                Most people scroll.<br>
                You actually looked.
            </p>

            <button
                id="closeSecret"
                type="button"
            >
                CLOSE
            </button>

        </div>
    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>

</body>
</html>
